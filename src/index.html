<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Open API Client</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="workspace-title">⌂　 My Workspace</span
      ><strong>◈　Open API Client</strong
      ><span class="title-end">LOCAL WORKSPACE</span>
    </header>
    <div class="workspace">
      <aside>
        <div class="sidebar-heading">
          <strong>⌄ Collections</strong
          ><button id="searchButton" title="Search requests · ⌘K">⌕</button
          ><button id="newCollection" title="New collection">＋</button
          ><button id="openCollection" title="Open collection file">⋯</button>
        </div>
        <div class="search-box">
          <input
            id="search"
            placeholder="Search collections and requests"
            aria-label="Search collections and requests"
          />
        </div>
        <nav id="tree" aria-label="Collections"></nav>
        <button id="specButton" class="sidebar-bottom">
          ♧　API Specs <span>＋</span>
        </button>
      </aside>
      <div
        class="sidebar-resizer"
        id="sidebarResizer"
        role="separator"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <main>
        <div class="collection-toolbar">
          <button id="collectionHome" class="collection-title">
            ⬡　<span id="activeTitle"></span>　⌄
          </button>
          <div class="toolbar-actions">
            <button id="saveWorkspace" title="Save workspace · ⌘S">Save</button
            ><button id="gitButton">⑂ Git</button
            ><button id="runnerButton" title="Collection Runner">▷ Run</button
            ><button id="newRequest" title="New request · ⌘N">＋ Request</button
            ><button id="envButton" title="Configure environments">▤</button
            ><select
              id="environmentSelect"
              aria-label="Active environment"
            ></select>
          </div>
        </div>
        <div id="workTabs" class="work-tabs" role="tablist"></div>
        <section id="view"></section>
      </main>
    </div>
    <footer>
      <span id="status" role="status">Ready</span>
      <div>
        <span id="branchStatus"></span
        ><button id="shortcuts">⌘ Shortcuts</button><span>v0.2.0</span>
      </div>
    </footer>
    <dialog id="dialog">
      <form method="dialog">
        <h2 id="dialogTitle"></h2>
        <div id="dialogContent"></div>
        <div class="dialog-actions">
          <button id="dialogCancel" value="cancel">Cancel</button
          ><button id="dialogConfirm" type="button" class="primary">
            Create
          </button>
        </div>
      </form>
    </dialog>
    <script type="module" src="ui/app.js"></script>
  </body>
</html>
