<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Free Rider</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="ui/workspace-actions.css" />
    <link rel="stylesheet" href="ui/ux-fixes.css" />
    <link rel="stylesheet" href="ui/network-panel.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="workspace-title">⌂　 내 워크스페이스</span
      ><strong>◈　Free Rider</strong
      ><span class="title-end">LOCAL WORKSPACE</span>
    </header>
    <div class="workspace">
      <aside>
        <div class="sidebar-heading">
          <strong>컬렉션</strong
          ><button id="searchButton" title="Search requests · ⌘K">⌕</button
          ><button id="newCollection" title="New collection">＋</button
          ><button id="openCollection" title="컬렉션 메뉴" aria-label="컬렉션 메뉴" aria-expanded="false" popovertarget="collectionActions">⋯</button>
          <div id="collectionActions" popover aria-label="컬렉션 작업">
            <button id="importCollectionFile">컬렉션 파일 가져오기</button>
            <button id="exportActiveCollection">현재 컬렉션 내보내기</button>
          </div>
        </div>
        <div class="search-box">
          <input
            id="search"
            placeholder="컬렉션·요청 검색"
            aria-label="컬렉션·요청 검색"
          />
        </div>
        <nav id="tree" aria-label="Collections"></nav>
        <button id="scriptsButton" class="sidebar-bottom">전역 전후처리</button>
        <button id="specButton" class="sidebar-bottom">
          명세 연결 <span>＋</span>
        </button>
      </aside>
      <div
        class="sidebar-resizer"
        id="sidebarResizer"
        role="separator"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <main>
        <div class="collection-toolbar">
          <div class="collection-switcher">
            <button id="collectionHome" class="collection-title">
              ⬡　<span id="activeTitle"></span>
            </button>
            <button id="collectionSwitch" aria-label="컬렉션 선택" aria-expanded="false" popovertarget="collectionPicker">⌄</button>
            <div id="collectionPicker" popover aria-label="컬렉션 목록"></div>
          </div>
          <div class="toolbar-actions">
            <button id="saveWorkspace" title="Save workspace · ⌘S">저장</button
            ><button id="gitButton">⑂ Git</button
            ><button id="runnerButton" title="Collection Runner">컬렉션 실행</button
            ><button id="newRequest" title="New request · ⌘N">＋ 요청</button
            ><button id="envButton" title="Configure environments">▤</button
            ><select
              id="environmentSelect"
              aria-label="Active environment"
            ></select>
          </div>
        </div>
        <div id="workTabs" class="work-tabs" role="tablist"></div>
        <section id="view"></section>
      </main>
    </div>
    <footer>
      <span id="status" role="status">준비됨</span>
      <div>
        <span id="branchStatus"></span
        ><button id="mcpButton" title="로컬 MCP 서버 켜기">MCP 꺼짐</button
        ><button id="updateButton" title="업데이트 확인">업데이트 확인</button
        ><button id="shortcuts">⌘ Shortcuts</button><span id="appVersion">v0.3.1</span>
      </div>
    </footer>
    <dialog id="dialog">
      <form method="dialog">
        <h2 id="dialogTitle"></h2>
        <div id="dialogContent"></div>
        <div class="dialog-actions">
          <button id="dialogCancel" value="cancel" formnovalidate>취소</button
          ><button id="dialogConfirm" type="button" class="primary">
            Create
          </button>
        </div>
      </form>
    </dialog>
    <script type="module" src="ui/app.js"></script>
    <script type="module" src="ui/dialog-enter.mjs"></script>
    <script type="module" src="ui/network-panel.js"></script>
    <script type="module" src="ui/multipart-body.js"></script>
    <script type="module" src="ui/sidebar-collapse.js"></script>
    <script type="module" src="ui/workspace-actions.js"></script>
    <script type="module" src="ui/reveal-passwords.js"></script>
    <script type="module" src="ui/mcp-control.js"></script>
    <script type="module" src="ui/update-ui.js"></script>
  </body>
</html>
