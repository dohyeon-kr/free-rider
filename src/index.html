<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Free Rider</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="ui/workspace-actions.css" />
    <link rel="stylesheet" href="ui/ux-fixes.css" />
    <link rel="stylesheet" href="ui/network-panel.css" />
    <link rel="stylesheet" href="ui/realtime-request.css" />
    <link rel="stylesheet" href="ui/openapi-schema.css" />
    <link rel="stylesheet" href="ui/announcements.css" />
    <link rel="stylesheet" href="ui/script-reference.css" />
    <link rel="stylesheet" href="ui/brand-shell.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand-lockup" aria-label="Free Rider API Client">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/free-rider-app-icon.png" alt="" draggable="false" />
        </span>
        <span class="brand-copy">
          <strong>Free Rider</strong>
          <small>API CLIENT</small>
        </span>
      </div>
      <span class="workspace-title">
        <span data-lucide="house"></span>
        <span>내 워크스페이스</span>
      </span>
      <span class="title-end">RIDE FASTER · BUILD FURTHER</span>
    </header>
    <div class="workspace">
      <aside>
        <div class="sidebar-heading">
          <strong>컬렉션</strong
          ><button id="searchButton" class="icon-button" title="Search requests · ⌘K" aria-label="요청 검색"><span data-lucide="search"></span></button
          ><button id="toggleTreeCollapse" class="icon-button" title="모두 접기" aria-label="모두 접기"><span data-lucide="chevrons-up-down"></span></button
          ><button id="newCollection" class="icon-button" title="New collection" aria-label="새 컬렉션"><span data-lucide="plus"></span></button
          ><button id="openCollection" class="icon-button" title="컬렉션 메뉴" aria-label="컬렉션 메뉴" aria-expanded="false" popovertarget="collectionActions"><span data-lucide="ellipsis"></span></button>
          <div id="collectionActions" popover aria-label="컬렉션 작업">
            <button id="importCollectionFile">컬렉션 파일 가져오기</button>
            <button id="exportActiveCollection">현재 컬렉션 내보내기</button>
          </div>
        </div>
        <div class="search-box">
          <span class="search-icon" aria-hidden="true"><span data-lucide="search"></span></span>
          <input
            id="search"
            placeholder="컬렉션·요청 검색"
            aria-label="컬렉션·요청 검색"
          />
        </div>
        <nav id="tree" aria-label="Collections"></nav>
        <button id="scriptsButton" hidden aria-hidden="true">Interceptors</button>
        <button id="specButton" hidden aria-hidden="true">OpenAPI</button>
      </aside>
      <div
        class="sidebar-resizer"
        id="sidebarResizer"
        role="separator"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <main>
        <div class="collection-toolbar">
          <div class="collection-switcher">
            <button id="collectionHome" class="collection-title">
              <span class="button-icon" aria-hidden="true"><span data-lucide="hexagon"></span></span><span id="activeTitle"></span>
            </button>
            <button id="collectionSwitch" class="icon-button compact" aria-label="컬렉션 선택" aria-expanded="false" popovertarget="collectionPicker"><span data-lucide="chevron-down"></span></button>
            <div id="collectionPicker" popover aria-label="컬렉션 목록"></div>
          </div>
          <div class="toolbar-actions">
            <button id="saveWorkspace" title="Save workspace"><span data-lucide="save"></span><span>저장</span></button
            ><button id="gitButton"><span data-lucide="git-branch"></span><span>Git</span></button
            ><button id="runnerButton" title="Collection Runner"><span data-lucide="play"></span><span>컬렉션 실행</span></button
            ><button id="newRequest" class="accent-action" title="New request · ⌘N"><span data-lucide="plus"></span><span>요청</span></button
            ><button id="envButton" class="icon-button" title="Configure environments" aria-label="환경 설정"><span data-lucide="sliders-horizontal"></span></button
            ><select
              id="environmentSelect"
              aria-label="Active environment"
            ></select>
          </div>
        </div>
        <div id="workTabs" class="work-tabs" role="tablist"></div>
        <section id="view"></section>
      </main>
    </div>
    <footer>
      <span id="status" role="status">준비됨</span>
      <div>
        <span id="branchStatus"></span
        ><button id="mcpButton" title="로컬 MCP 서버 켜기">MCP 꺼짐</button
        ><button id="updateButton" title="업데이트 확인">업데이트 확인</button
        ><button id="announcementButton" title="공지" aria-label="공지" popovertarget="announcementPanel"><span data-lucide="bell"></span><span>공지</span><span id="announcementUnread" class="announcement-unread" hidden></span></button
        ><div id="announcementPanel" popover aria-label="공지 목록"></div
        ><button id="shortcuts"><span data-lucide="keyboard"></span><span>Shortcuts</span></button><span id="appVersion">v0.3.1</span>
      </div>
    </footer>
    <dialog id="dialog">
      <form method="dialog">
        <h2 id="dialogTitle"></h2>
        <div id="dialogContent"></div>
        <div class="dialog-actions">
          <button id="dialogCancel" value="cancel" formnovalidate>취소</button
          ><button id="dialogConfirm" type="button" class="primary">
            Create
          </button>
        </div>
      </form>
    </dialog>
    <script type="module" src="ui/lucide-icons.js"></script>
    <script type="module" src="ui/app.js"></script>
    <script type="module" src="ui/dialog-enter.mjs"></script>
    <script type="module" src="ui/network-panel.js"></script>
    <script type="module" src="ui/multipart-body.js"></script>
    <script type="module" src="ui/sidebar-collapse.js"></script>
    <script type="module" src="ui/workspace-actions.js"></script>
    <script type="module" src="ui/reveal-passwords.js"></script>
    <script type="module" src="ui/mcp-control.js"></script>
    <script type="module" src="ui/update-ui.js"></script>
    <script type="module" src="ui/announcements.js"></script>
    <script type="module" src="ui/script-reference.js"></script>
  </body>
</html>
