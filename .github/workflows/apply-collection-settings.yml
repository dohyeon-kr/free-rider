name: Apply collection settings codemod

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/collection-interceptors-openapi' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changes
        run: |
          node scripts/prepatch-smoke.mjs
          node scripts/apply-collection-settings.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check diff
        run: git diff --check
      - name: Commit generated implementation
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          rm scripts/prepatch-smoke.mjs
          rm scripts/apply-collection-settings.mjs
          rm .github/workflows/apply-collection-settings.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: scope interceptors and OpenAPI to collections"
          git push origin "HEAD:${HEAD_REF}"
