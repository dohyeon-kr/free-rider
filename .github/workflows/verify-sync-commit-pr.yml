name: Verify optional Git commit after sync
on:
  push:
    branches: [automation/sync-commit-pr-20260917]
permissions:
  contents: write
jobs:
  integrate-and-verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Integrate the prepared feature
        run: node scripts/apply-sync-commit-pr.cjs
      - run: npm ci --ignore-scripts
      - name: Full unit and integration tests
        run: npm test
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Native Electron regression smoke
        run: npm run test:electron
      - name: Commit verified source only
        run: |
          git diff --check
          git rm scripts/apply-sync-commit-pr.cjs .github/workflows/verify-sync-commit-pr.yml
          git add src test docs/site/guide/git.md docs/site/en/guide/git.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(git): offer an optional collection commit after sync'
          git push origin HEAD:automation/sync-commit-pr-20260917
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-commit-regression-ui
          path: test-results/
          if-no-files-found: ignore
