name: macOS build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    concurrency:
      group: macos-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  release-plan:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      should_release: ${{ steps.plan.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan package.json release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "### PR build — release disabled" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null || true)
          if [[ -n "$RELEASE_JSON" ]]; then
            IS_DRAFT=$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')
            if [[ "$IS_DRAFT" == "false" ]]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "### ${TAG} is already published" >> "$GITHUB_STEP_SUMMARY"
              echo "Bump package.json version to create the next release." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG already points to $TAG_SHA, not $GITHUB_SHA." >&2
            echo "Bump package.json version before releasing this commit." >&2
            exit 1
          fi

          if [[ -z "$RELEASE_JSON" ]]; then
            if [[ -n "$TAG_SHA" ]]; then
              gh release create "$TAG" \
                --verify-tag \
                --title "Free Rider $TAG" \
                --generate-notes \
                --draft
            else
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "Free Rider $TAG" \
                --generate-notes \
                --draft
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "### Preparing $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "The release stays draft until both macOS architectures finish successfully." >> "$GITHUB_STEP_SUMMARY"

  build:
    concurrency:
      group: macos-build-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    needs: [test, release-plan]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Test native Electron window and IPC
        run: npm run test:electron
        timeout-minutes: 2

      - name: Choose signing mode
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          CERTIFICATE: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo 'mode=pr-unsigned' >> "$GITHUB_OUTPUT"
            echo '### Unsigned PR build — package validation only' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$CERTIFICATE" && -n "$CERT_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$TEAM_ID" ]]; then
            echo 'mode=developer-id' >> "$GITHUB_OUTPUT"
          elif [[ -n "$CERTIFICATE$CERT_PASSWORD$APPLE_ID$APPLE_PASSWORD$TEAM_ID" ]]; then
            echo 'Apple signing secrets are incomplete. Configure all five secrets.' >&2
            exit 1
          else
            echo 'mode=adhoc' >> "$GITHUB_OUTPUT"
            echo '### Ad-hoc signed test build — not Apple notarized' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Developer ID signed and notarized build
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --${{ matrix.arch }} -c.forceCodeSigning=true -c.mac.notarize=true

      - name: Ad-hoc signed test build
        if: steps.signing.outputs.mode == 'adhoc'
        run: npm run dist:mac -- --${{ matrix.arch }} -c.mac.identity=- -c.mac.notarize=false

      - name: Unsigned PR build
        if: steps.signing.outputs.mode == 'pr-unsigned'
        run: npm run dist:mac -- --${{ matrix.arch }} -c.mac.identity=null -c.mac.notarize=false

      - name: Verify packaged application
        timeout-minutes: 2
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        shell: bash
        run: |
          APP_PATH=$(find dist -maxdepth 2 -name '*.app' -type d -print -quit)
          test -n "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/Free Rider"
          test -f "$APP_PATH/Contents/Info.plist"
          test -f "$APP_PATH/Contents/Resources/app.asar"

          if [[ "$SIGNING_MODE" != 'pr-unsigned' ]]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign --display --verbose=4 "$APP_PATH"
          fi

          if [[ "$SIGNING_MODE" == 'developer-id' ]]; then
            xcrun stapler validate "$APP_PATH"
            spctl --assess --type execute --verbose=2 "$APP_PATH"
          fi

          shasum -a 256 dist/*.dmg dist/*.zip > "dist/SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Upload draft release assets
        if: needs.release-plan.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.dmg \
            dist/*.zip \
            "dist/SHA256SUMS-${{ matrix.arch }}.txt" \
            --clobber

  publish-release:
    needs: [release-plan, build]
    if: needs.release-plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "### Published $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
