name: macOS build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    concurrency:
      group: macos-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  release:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    concurrency:
      group: semantic-release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - name: Require Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=()
          [[ -n "$CSC_LINK" ]] || missing+=("CSC_LINK")
          [[ -n "$CSC_KEY_PASSWORD" ]] || missing+=("CSC_KEY_PASSWORD")
          [[ -n "$APPLE_ID" ]] || missing+=("APPLE_ID")
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=("APPLE_TEAM_ID")

          if (( ${#missing[@]} )); then
            printf 'Missing required release secret: %s\n' "${missing[@]}" >&2
            echo 'Configure all five Apple signing secrets before publishing a release.' >&2
            exit 1
          fi

          echo '### Developer ID signing configured' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -f .semantic-release-tag
          npx --yes \
            --package=semantic-release@25.0.9 \
            --package=@semantic-release/commit-analyzer@13.0.1 \
            --package=@semantic-release/release-notes-generator@14.1.1 \
            --package=@semantic-release/github@12.0.9 \
            --package=@semantic-release/git@11.0.1 \
            --package=@semantic-release/exec@7.1.0 \
            semantic-release

          if [[ -s .semantic-release-tag ]]; then
            TAG=$(cat .semantic-release-tag)
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "### Semantic release $TAG prepared" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "### No release-worthy commits" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    if: ${{ always() && needs.test.result == 'success' && (github.event_name == 'pull_request' || needs.release.outputs.released == 'true') }}
    needs: [test, release]
    concurrency:
      group: macos-build-${{ matrix.arch }}-${{ github.event_name == 'pull_request' && github.ref || needs.release.outputs.tag }}
      cancel-in-progress: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Test native Electron window and IPC
        run: npm run test:electron
        timeout-minutes: 2

      - name: Choose signing mode
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          CERTIFICATE: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo 'mode=pr-unsigned' >> "$GITHUB_OUTPUT"
            echo '### Unsigned PR build — package validation only' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$CERTIFICATE" && -n "$CERT_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$TEAM_ID" ]]; then
            echo 'mode=developer-id' >> "$GITHUB_OUTPUT"
          else
            echo 'Apple signing secrets are required for release builds.' >&2
            exit 1
          fi

      - name: Developer ID signed and notarized build
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --${{ matrix.arch }} -c.forceCodeSigning=true -c.mac.notarize=true

      - name: Unsigned PR build
        if: steps.signing.outputs.mode == 'pr-unsigned'
        run: npm run dist:mac -- --${{ matrix.arch }} -c.mac.identity=null -c.mac.notarize=false

      - name: Verify packaged application
        timeout-minutes: 2
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        shell: bash
        run: |
          APP_PATH=$(find dist -maxdepth 2 -name '*.app' -type d -print -quit)
          test -n "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/Free Rider"
          test -f "$APP_PATH/Contents/Info.plist"
          test -f "$APP_PATH/Contents/Resources/app.asar"

          if [[ "$SIGNING_MODE" != 'pr-unsigned' ]]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign --display --verbose=4 "$APP_PATH"
          fi

          if [[ "$SIGNING_MODE" == 'developer-id' ]]; then
            xcrun stapler validate "$APP_PATH"
            spctl --assess --type execute --verbose=2 "$APP_PATH"
          fi

          shasum -a 256 dist/*.dmg dist/*.zip > "dist/SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Upload draft release assets
        if: ${{ github.event_name != 'pull_request' && needs.release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          VERSIONED_DMG=$(find dist -maxdepth 1 -name 'Free-Rider-*-mac-${{ matrix.arch }}.dmg' -print -quit)
          test -n "$VERSIONED_DMG"
          cp "$VERSIONED_DMG" "dist/Free-Rider-mac-${{ matrix.arch }}.dmg"

          gh release upload "$RELEASE_TAG" \
            dist/*.dmg \
            dist/*.zip \
            "dist/SHA256SUMS-${{ matrix.arch }}.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-release:
    needs: [release, build]
    if: ${{ needs.release.outputs.released == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "### Published $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
