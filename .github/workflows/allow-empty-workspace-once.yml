name: Guard empty workspace request once

on:
  push:
    branches: ["fix/allow-empty-workspace"]
    paths:
      - ".github/workflows/allow-empty-workspace-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard new request without collections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/ui/app.js")
          text = path.read_text()
          pattern = r'function newRequest\(group = ""\) \{\n  const col = c\(\);'
          replacement = '''function newRequest(group = "") {
            const col = c();
            if (!col) {
              $("newCollection").click();
              return;
            }'''
          text, count = re.subn(pattern, replacement, text, count=1)
          assert count == 1, "newRequest target not found"
          path.write_text(text)
          PY

      - name: Verify JavaScript and tests
        shell: bash
        run: |
          node --input-type=module --check < src/ui/app.js
          npm ci --ignore-scripts
          npm test

      - name: Commit to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/app.js
          git commit -m "Guard requests in an empty workspace"
          git push origin HEAD:main
