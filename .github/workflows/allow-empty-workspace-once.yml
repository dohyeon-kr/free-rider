name: Allow empty workspace once

on:
  push:
    branches: ["fix/allow-empty-workspace"]
    paths:
      - ".github/workflows/allow-empty-workspace-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Allow deleting the final collection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("src/ui/app.js")
          app = app_path.read_text()

          old_tabs = '''  root.append(
            button("＋", () => newRequest(), {
              class: "new-request-tab",
              title: "새 요청",
              "aria-label": "새 요청 탭 추가",
            }),
          );
          '''
          new_tabs = '''  root.append(
            button("＋", () => c() ? newRequest() : $("newCollection").click(), {
              class: "new-request-tab",
              title: c() ? "새 요청" : "새 컬렉션",
              "aria-label": c() ? "새 요청 탭 추가" : "새 컬렉션 만들기",
            }),
          );
          '''
          assert app.count(old_tabs) == 1, "renderTabs target not found"
          app = app.replace(old_tabs, new_tabs)

          old_render = '''function render() {
            renderTree();
            renderTabs();
            $("activeTitle").textContent = c().title;
            const es = $("environmentSelect");
            es.replaceChildren(
              ...c().environments.map((e) => el("option", { value: e.id, text: e.name })),
            );
            es.value = env(c()).id;
            $("branchStatus").textContent = gitInfo.get(c().id)?.branch || "";
            const t = active();
            if (!t) {
              $("view").replaceChildren(
                el(
                  "div",
                  { class: "view-inner" },
                  el("h2", { text: "Your workspace" }),
                  button("Open collection overview", () => open("overview")),
                ),
              );
              return;
            }
            const col = c();
            const view = {
          '''
          new_render = '''function render() {
            renderTree();
            renderTabs();
            const col = c();
            for (const id of [
              "collectionHome",
              "collectionSwitch",
              "newRequest",
              "envButton",
              "specButton",
              "gitButton",
              "runnerButton",
              "scriptsButton",
              "exportActiveCollection",
            ]) {
              const control = $(id);
              if (control) control.disabled = !col;
            }
            $("activeTitle").textContent = col?.title || "컬렉션 없음";
            const es = $("environmentSelect");
            if (!col) {
              es.replaceChildren();
              es.disabled = true;
              $("branchStatus").textContent = "";
              state.activeCollection = null;
              state.activeTab = null;
              $("view").replaceChildren(
                el(
                  "div",
                  { class: "view-inner" },
                  el("h2", { text: "컬렉션이 없습니다" }),
                  el("p", {
                    class: "muted",
                    text: "새 컬렉션을 만들거나 기존 컬렉션 파일을 가져오세요.",
                  }),
                  button("새 컬렉션 만들기", () => $("newCollection").click(), {
                    class: "primary",
                  }),
                ),
              );
              return;
            }
            es.disabled = false;
            es.replaceChildren(
              ...col.environments.map((e) => el("option", { value: e.id, text: e.name })),
            );
            es.value = env(col).id;
            $("branchStatus").textContent = gitInfo.get(col.id)?.branch || "";
            const t = active();
            if (!t) {
              $("view").replaceChildren(
                el(
                  "div",
                  { class: "view-inner" },
                  el("h2", { text: "Your workspace" }),
                  button("Open collection overview", () => open("overview")),
                ),
              );
              return;
            }
            const view = {
          '''
          assert app.count(old_render) == 1, "render target not found"
          app = app.replace(old_render, new_render)

          old_ready = '''window.appReady = (async () => {
            const saved = await action(() => api["workspace-load"]());
            if (saved?.collections?.length) {
              state = saved;
              state.collections.forEach(normalize);
              state.selectedEnvironments ||= {};
              state.tabs ||= [];
              state.layout ||= "vertical";
              collapsed = new Set(state.collapsed || []);
            }
            state.activeCollection ||= state.collections[0].id;
            if (!state.activeTab) open("overview");
            else render();
          })();
          '''
          new_ready = '''window.appReady = (async () => {
            const saved = await action(() => api["workspace-load"]());
            if (saved && Array.isArray(saved.collections)) {
              state = saved;
              state.collections.forEach(normalize);
              state.selectedEnvironments ||= {};
              state.tabs ||= [];
              state.layout ||= "vertical";
              collapsed = new Set(state.collapsed || []);
            }
            if (state.collections.length) {
              state.activeCollection ||= state.collections[0].id;
              if (!state.activeTab) open("overview");
              else render();
            } else {
              state.activeCollection = null;
              state.activeTab = null;
              render();
            }
          })();
          '''
          assert app.count(old_ready) == 1, "appReady target not found"
          app = app.replace(old_ready, new_ready)
          app_path.write_text(app)

          actions_path = Path("src/ui/workspace-actions.js")
          actions = actions_path.read_text()
          old_delete = '''    if (!snapshot?.collections?.length) throw new Error("워크스페이스를 불러오지 못했습니다.");
              if (snapshot.collections.length === 1) throw new Error("마지막 컬렉션은 삭제할 수 없습니다.");
          '''
          new_delete = '''    if (!snapshot || !Array.isArray(snapshot.collections)) throw new Error("워크스페이스를 불러오지 못했습니다.");
          '''
          assert actions.count(old_delete) == 1, "delete guard target not found"
          actions = actions.replace(old_delete, new_delete)

          old_active = '''    if (snapshot.activeCollection === cid) snapshot.activeCollection = snapshot.collections[0].id;
          '''
          new_active = '''    if (snapshot.activeCollection === cid) snapshot.activeCollection = snapshot.collections[0]?.id || null;
          '''
          assert actions.count(old_active) == 1, "active collection target not found"
          actions = actions.replace(old_active, new_active)
          actions_path.write_text(actions)
          PY

      - name: Verify JavaScript and tests
        shell: bash
        run: |
          node --input-type=module --check < src/ui/app.js
          node --input-type=module --check < src/ui/workspace-actions.js
          npm ci --ignore-scripts
          npm test

      - name: Commit to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/app.js src/ui/workspace-actions.js
          git commit -m "Allow deleting the final collection"
          git push origin HEAD:main
