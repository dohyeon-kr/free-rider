name: Verify named Git repository creation
on:
  push:
    branches: [automation/git-create-folder-20260917]
permissions:
  contents: write
jobs:
  integrate-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed integration
        run: |
          node scripts/implement-git-create.cjs
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/smoke.cjs';
          const anchor = '  await screenshot("git");';
          const source = fs.readFileSync(file, 'utf8');
          if (source.split(anchor).length !== 2) throw Error('Smoke anchor changed');
          fs.writeFileSync(file, source.replace(anchor, anchor + '\n  await require("./git-create-smoke.cjs").run({ js, poll, win, gitPath });'));
          NODE
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test docs/site/guide/git.md docs/site/en/guide/git.md
          git commit -m 'feat(git): create repositories in named folders'
          git push origin HEAD:automation/git-create-folder-20260917
      - run: npm ci --ignore-scripts
      - name: Full unit suite
        run: npm test
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Electron smoke including repository creation
        run: npm run test:electron
      - name: Upload native UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-create-native-ui
          path: test-results/
          if-no-files-found: ignore
