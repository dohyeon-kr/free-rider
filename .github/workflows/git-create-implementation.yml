name: Verify named Git repository creation
on:
  push:
    branches: [automation/git-create-folder-20260917]
permissions:
  contents: read
jobs:
  integrate-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full unit suite
        run: npm test
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Electron smoke including repository creation
        run: npm run test:electron
      - name: Upload native UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-create-native-ui
          path: test-results/
          if-no-files-found: ignore
