name: Apply and verify OpenAPI Basic Auth
on:
  push:
    branches: [feat/openapi-basic-auth]
    paths: [.github/workflows/openapi-auth-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openapi-basic-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed integration changes
        run: python3 .github/scripts/apply-openapi-auth.py
      - run: npm ci
      - name: Unit and real transport regression tests
        run: npm test
      - name: Electron UI regression smoke test
        run: npm run test:electron
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cjs src/ui/app.js src/smoke.cjs docs/site/guide/openapi-sync.md docs/site/en/guide/openapi-sync.md
          git diff --cached --check
          git commit -m 'feat(openapi): wire Basic Auth into specification import and synchronization'
          git push origin HEAD:feat/openapi-basic-auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-basic-auth-smoke
          path: test-results/
