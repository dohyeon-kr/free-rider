name: Canonicalize license

on:
  push:
    branches:
      - chore/all-free-agpl-license
    paths:
      - .github/workflows/license-canonicalize.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/all-free-agpl-license

      - name: Replace license with SPDX canonical text
        run: |
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-only.txt -o LICENSE
          rm .github/workflows/license-canonicalize.yml

      - name: Commit canonical license
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync canonical AGPL-3.0-only license"
          git push
